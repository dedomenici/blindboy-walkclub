<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#f4f1ea;font-family:system-ui,sans-serif}
form{background:#1c1c1c;border:2px solid #C8102E;padding:28px;width:min(320px,86vw);text-align:center}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:.04em;text-transform:uppercase}
p{margin:0 0 16px;color:#bbb;font-size:.9rem}
input[type=password]{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:0;background:#2a2a2a;color:#fff;margin-bottom:12px}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.9rem;margin-bottom:12px}
button{width:100%;padding:12px;border:0;background:#C8102E;color:#fff;font-weight:700;font-size:1rem;text-transform:uppercase;cursor:pointer}

<meta name="description" content="A dérive with headphones — a guided walking tour of Limerick. Password required."><meta property="og:type" content="website"><meta property="og:title" content="Blindboy Walkclub"><meta property="og:description" content="A dérive with headphones — a guided walking tour of Limerick. Password required."><meta property="og:url" content="https://dedomenici.github.io/blindboy-walkclub/"><meta property="og:image" content="https://dedomenici.github.io/blindboy-walkclub/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Blindboy Walkclub"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Blindboy Walkclub"><meta name="twitter:description" content="A dérive with headphones — a guided walking tour of Limerick. Password required."><meta name="twitter:image" content="https://dedomenici.github.io/blindboy-walkclub/og-image.png"></head>
<body>
<form id="bbw-form">
<h1>Blindboy Walkclub</h1>
<p>Enter the password to open the walk.</p>
<input id="bbw-pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<label><input id="bbw-remember" type="checkbox"> Remember me (30 days)</label>
<button id="bbw-go" type="submit">Open</button>
<p id="bbw-msg" aria-live="polite"></p>
</form>

<script src="c1.js"></script>

<script src="c5.js"></script>

<script src="c8.js"></script>
<script>
(()=>{const SALT="f2864a02821c8af2e2e88fd9bd262102",IV="70e009e4ef0512f6401750fe",K="bbw-key",X="bbw-exp",S=crypto.subtle;
const CT=(window.__CT||[]).join("");
const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b2h=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("");
async function dec(raw){const k=await S.importKey("raw",h2b(raw),"AES-GCM",false,["decrypt"]);
const pt=await S.decrypt({name:"AES-GCM",iv:h2b(IV)},k,Uint8Array.from(atob(CT),c=>c.charCodeAt(0)));
return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
function show(t){var pack=Array.from(document.querySelectorAll("script[data-goatcounter],script#gc-events")).map(function(s){return s.outerHTML}).join("");if(pack&&t.indexOf("dedomenici.goatcounter.com/count")<0)t=/<\/body>/i.test(t)?t.replace(/<\/body>/i,pack+"</body>"):t+pack;document.open();document.write(t);document.close()}
async function derive(pw){const b=await S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await S.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:h2b(SALT),iterations:600000},b,{name:"AES-GCM",length:256},true,["decrypt"]);
return b2h(await S.exportKey("raw",k))}
function forget(){localStorage.removeItem(K);localStorage.removeItem(X)}
(async()=>{if(/logout/.test(location.search+location.hash)){forget();return}
const r=localStorage.getItem(K),e=+localStorage.getItem(X);
if(r&&e>Date.now()){try{show(await dec(r))}catch(_){forget()}}else forget()})();
document.getElementById("bbw-form").addEventListener("submit",async ev=>{ev.preventDefault();
const m=document.getElementById("bbw-msg");m.textContent="Unlocking…";let t,raw;
try{raw=await derive((v=>(v=v.trim(),v.charAt(0).toUpperCase()+v.slice(1).toLowerCase()))(document.getElementById("bbw-pw").value));t=await dec(raw)}catch(_){m.textContent="Wrong password — try again.";try{window.__gcTrack&&window.__gcTrack("gate-fail","Password gate fail")}catch(g){}return}
if(document.getElementById("bbw-remember").checked){localStorage.setItem(K,raw);localStorage.setItem(X,Date.now()+2592e6)}
try{window.__gcTrack&&window.__gcTrack("gate-success","Password gate success")}catch(g){}
show(t)})})();
</script>
<script data-goatcounter="https://dedomenici.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script id="gc-events">
(function () {
  var PREFIX = "walkclub";
  var queue = [];
  var timer = 0;
  function flush() {
    if (!window.goatcounter || typeof window.goatcounter.count !== "function") return false;
    while (queue.length) window.goatcounter.count(queue.shift());
    return true;
  }
  function send(payload) {
    queue.push(payload);
    if (flush()) return;
    if (timer) return;
    var n = 0;
    timer = setInterval(function () {
      n++;
      if (flush() || n > 40) { clearInterval(timer); timer = 0; }
    }, 250);
  }
  function track(name, title) {
    send({ path: PREFIX + "-click-" + name, title: title || name, event: true });
  }
  window.__gcTrack = track;
  function slug(s) {
    return String(s || "").toLowerCase().replace(/&[^;]+;/g, " ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "click";
  }
  function labelOf(el) {
    var custom = el.getAttribute("data-goat");
    if (custom) return custom;
    var raw = el.getAttribute("aria-label") || el.getAttribute("title") || el.value || (el.textContent || "");
    return String(raw).replace(/\s+/g, " ").trim().slice(0, 80);
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var named = t.closest("[data-goat]");
    if (named) {
      track(named.getAttribute("data-goat"), named.getAttribute("data-goat-title") || named.getAttribute("data-goat"));
      return;
    }
    var el = t.closest("button, a, [role='button'], input[type='submit'], input[type='button'], summary");
    if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
    if (el.closest("form") && el.closest("form").querySelector("input[type=password]")) return;
    var label = labelOf(el);
    if (!label) return;
    if (/age\s*\d/i.test(label) || label.length > 60) {
      track("item", "Item");
      return;
    }
    if (el.tagName === "A") {
      var href = el.getAttribute("href") || "";
      if (/^https?:/i.test(href) || (el.host && el.host !== location.host)) {
        try {
          var u = new URL(href, location.href);
          if (u.host && u.host !== location.host) {
            track("external-" + slug(u.hostname), "External: " + u.hostname);
            return;
          }
        } catch (err) {}
      }
    }
    track(slug(label), label);
  }, true);
})();
</script>
